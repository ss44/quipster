version: "2"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose
    - gocyclo
    - gosec
    - misspell
    - nilerr
    - prealloc
    - revive
    - unconvert
  settings:
    govet:
      enable-all: true
    errcheck:
      check-type-assertions: true
      check-blank: true
    gocyclo:
      min-complexity: 15
    goconst:
      min-len: 3
      min-occurrences: 3
    misspell:
      locale: US

formatters:
  enable:
    - gofmt
    - goimports

run:
  go: "1.27"
