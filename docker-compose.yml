name: quipster

services:
  app:
    build: .
    ports: ["${APP_PORT:-8080}:8080"]
    environment:
      MEILI_URL: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?set MEILI_MASTER_KEY in .env}
      MEDIA_DIR: /media
      DATA_DIR: /data
      CACHE_DIR: /cache
      SUBTITLE_WORKERS: "4"
      INDEX_WORKERS: "1"
      CLIP_WORKERS: "2"
      API_TOKEN: ${API_TOKEN:-}
      CLIP_PAD_MS: "250"
      MAX_CLIP_SEC: "120"
      CACHE_MAX_GB: "10"
      SCAN_INTERVAL: ${SCAN_INTERVAL:-}
    volumes:
      - ${MEDIA_DIR:?set MEDIA_DIR in .env}:/media:ro
      - app-data:/data
      - app-cache:/cache
    depends_on:
      meilisearch:
        condition: service_healthy
    restart: unless-stopped

  worker:
    profiles: ["workers"]
    build: .
    environment:
      ROLE: worker
      MEILI_URL: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEDIA_DIR: /media
      DATA_DIR: /data
      CACHE_DIR: /cache
      SUBTITLE_WORKERS: "4"
      INDEX_WORKERS: "1"
      CLIP_WORKERS: "2"
    volumes:
      - ${MEDIA_DIR}:/media:ro
      - app-data:/data
      - app-cache:/cache
    depends_on:
      meilisearch:
        condition: service_healthy
    deploy:
      replicas: 1
    restart: unless-stopped

  meilisearch:
    image: getmeili/meilisearch:v1.11
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_NO_ANALYTICS: "true"
      MEILI_HTTP_PAYLOAD_SIZE_LIMIT: 200MB
    volumes:
      - meili-data:/meili_data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:7700/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # GPU variant: docker compose --profile gpu up app-gpu
  app-gpu:
    profiles: ["gpu"]
    build: .
    ports: ["8080:8080"]
    environment:
      MEILI_URL: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEDIA_DIR: /media
      DATA_DIR: /data
      CACHE_DIR: /cache
      SUBTITLE_WORKERS: "4"
      CLIP_WORKERS: "2"
    volumes:
      - ${MEDIA_DIR}:/media:ro
      - app-data:/data
      - app-cache:/cache
      - /dev/dri:/dev/dri
    group_add:
      - render
      - video
    depends_on:
      meilisearch:
        condition: service_healthy
    restart: unless-stopped

volumes:
  app-data: {}
  app-cache: {}
  meili-data: {}