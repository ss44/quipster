name: quipster

services:
  app:
    image: ghcr.io/ss44/quipster:latest
    pull_policy: always
    ports:
      - "8080:8080"
    environment:
      MEILI_URL: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?set MEILI_MASTER_KEY in .env}
      MEDIA_DIR: /media
      DATA_DIR: /data
      CACHE_DIR: /cache
      CLIP_PREVIEW_RES: ${CLIP_PREVIEW_RES:-640:-2}
      CLIP_ACCURATE_RES: ${CLIP_ACCURATE_RES:-1280:-2}
      CLIP_CPU_PRESET: ${CLIP_CPU_PRESET:-}
      EXTRACT_CONNS: ${EXTRACT_CONNS:-4}
    volumes:
      - type: bind
        source: ${MEDIA_DIR:?set MEDIA_DIR in .env}
        target: /media
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${CACHE_DIR:?set CACHE_DIR in .env}
        target: /cache
        bind:
          create_host_path: false
      - app-data:/data
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - render
      - video
    depends_on:
      meilisearch:
        condition: service_healthy
    restart: unless-stopped

  meilisearch:
    image: getmeili/meilisearch:v1.11
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?set MEILI_MASTER_KEY in .env}
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meili-data:/meili_data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:7700/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  app-data: {}
  meili-data: {}
